<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f27022" />
      <stop offset="100%" stop-color="#f9a01b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d3153" />
      <stop offset="100%" stop-color="#1b5380" />
    </linearGradient>
  </defs>
  
  <!-- Transparent Background / Clear canvas wrapper -->
  <g transform="translate(24, 16)">
    <!-- Blue Column 1 (Left background segment) -->
    <path d="M 60,360 L 140,360 L 140,260 Z" fill="url(#blueGrad)" />
    
    <!-- Blue Column 2 (Right background tracking column) -->
    <path d="M 280,360 L 360,360 L 360,140 L 280,240 Z" fill="url(#blueGrad)" />
    
    <!-- Main Upward Dynamic Arrow Line Layer -->
    <!-- Mimics the segmented sharp vector folds of the chosen line chart -->
    <path d="M 20,360 
             L 180,140 
             L 280,260 
             L 420,70 
             L 330,65 
             L 435,45 
             L 450,150 
             L 410,100
             L 280,290 
             L 180,175 
             L 40,360 Z" 
          fill="url(#orangeGrad)" />
  </g>
</svg>